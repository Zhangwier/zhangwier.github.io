<rect width="900" height="795" fill="url(#g)"/><rect width="900" height="795" fill="url(#dots)"/>
<rect x="18" y="18" width="864" height="759" rx="22" fill="none" stroke="#38516a" stroke-opacity="0.72"/>
<text x="55" y="87" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="35" font-weight="700" fill="#e2e8f0" text-anchor="start">会生成答案 ≠ 能交付可靠成果</text>
<text x="56" y="124" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="21" font-weight="400" fill="#9ab0c4" text-anchor="start">专业任务需要可验证的外部工具与审查</text>
