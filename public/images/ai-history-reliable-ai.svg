<text x="132" y="463" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="23" font-weight="400" fill="#9ab0c4" text-anchor="start">获取精确数据与编码</text>
