<text x="132" y="569" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="23" font-weight="400" fill="#9ab0c4" text-anchor="start">执行确定性公式与运算</text>
<line x1="457" y1="587" x2="457" y2="603" stroke="#5eead4" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
