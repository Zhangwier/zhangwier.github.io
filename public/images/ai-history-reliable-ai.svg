<text x="132" y="644" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="28" font-weight="650" fill="#e2e8f0" text-anchor="start">人工审查</text>
<text x="132" y="675" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="23" font-weight="400" fill="#9ab0c4" text-anchor="start">确认边界、证据与责任</text>
<text x="55" y="747" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="400" fill="#9ab0c4" text-anchor="start">这是可组合的工程工作流示意，不意味着一套系统已经自动可信。</text>
