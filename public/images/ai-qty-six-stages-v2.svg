<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 545" width="100%" role="img" aria-label="工程量复核：六阶段与失败回退"><rect width="760" height="545" rx="20" fill="#0f172a"/><rect x="1" y="1" width="758" height="543" rx="19" fill="none" stroke="#334155"/><text x="36" y="49" class="heading">工程量复核：六阶段与失败回退</text><text x="36" y="78" class="sub">每一阶段交付可检查证据，不满足条件则回到责任阶段</text><style>.heading{font:700 25px 'Noto Sans CJK SC',sans-serif;fill:#e2e8f0}.sub{font:14px 'Noto Sans CJK SC',sans-serif;fill:#94a3b8}.node-title{font:700 17px 'Noto Sans CJK SC',sans-serif;fill:#e2e8f0}.node-desc{font:13px 'Noto Sans CJK SC',sans-serif;fill:#94a3b8}.small{font:12px 'Noto Sans CJK SC',sans-serif;fill:#94a3b8}.tag{font:700 12px 'Noto Sans CJK SC',sans-serif;fill:#5eead4}</style><rect x="93" y="110" width="535" height="51" rx="14" fill="#1e293b" stroke="#334155"/><text x="117" y="131" class="node-title" text-anchor="start">01 侦察</text><text x="350" y="131" class="node-desc" text-anchor="start">文件 / 版本 / 可读性</text><path d="M361 161 L361 174" fill="none" stroke="#5eead4" stroke-width="2"/><path d="M355 166L361 174L367 166" fill="none" stroke="#5eead4" stroke-width="2"/><rect x="93" y="174" width="535" height="51" rx="14" fill="#1e293b" stroke="#334155"/><text x="117" y="195" class="node-title" text-anchor="start">02 定界</text><text x="350" y="195" class="node-desc" text-anchor="start">范围 / 口径 / 决策权</text><path d="M361 225 L361 238" fill="none" stroke="#5eead4" stroke-width="2"/><path d="M355 230L361 238L367 230" fill="none" stroke="#5eead4" stroke-width="2"/><rect x="93" y="238" width="535" height="51" rx="14" fill="#1e293b" stroke="#334155"/><text x="117" y="259" class="node-title" text-anchor="start">03 拆解</text><text x="350" y="259" class="node-desc" text-anchor="start">分项 / 图号 / 数量关系</text><path d="M361 289 L361 302" fill="none" stroke="#5eead4" stroke-width="2"/><path d="M355 294L361 302L367 294" fill="none" stroke="#5eead4" stroke-width="2"/><rect x="93" y="302" width="535" height="51" rx="14" fill="#1e293b" stroke="#334155"/><text x="117" y="323" class="node-title" text-anchor="start">04 核量</text><text x="350" y="323" class="node-desc" text-anchor="start">参数 / 来源 / 联动公式</text><path d="M361 353 L361 366" fill="none" stroke="#5eead4" stroke-width="2"/><path d="M355 358L361 366L367 358" fill="none" stroke="#5eead4" stroke-width="2"/><rect x="93" y="366" width="535" height="51" rx="14" fill="#1e293b" stroke="#334155"/><text x="117" y="387" class="node-title" text-anchor="start">05 复核</text><text x="350" y="387" class="node-desc" text-anchor="start">独立取证 / 重算 / 检查</text><path d="M361 417 L361 430" fill="none" stroke="#5eead4" stroke-width="2"/><path d="M355 422L361 430L367 422" fill="none" stroke="#5eead4" stroke-width="2"/><rect x="93" y="430" width="535" height="51" rx="14" fill="#1e293b" stroke="#5eead4"/><text x="117" y="451" class="node-title" text-anchor="start">06 交付</text><text x="350" y="451" class="node-desc" text-anchor="start">差异 / 问题 / 追溯</text><path d="M79 410H53V134H83" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 5"/><text x="43" y="289" class="tag" text-anchor="middle">退</text><text x="43" y="309" class="tag" text-anchor="middle">回</text><rect x="93" y="505" width="535" height="26" rx="8" fill="#0f172a" stroke="#334155"/><text x="360" y="523" class="small" text-anchor="middle">PASS：交付  ·  REWORK：返工  ·  ESCALATE：人工裁定</text></svg>