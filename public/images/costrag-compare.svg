<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" role="img" aria-label="直接把文件夹交给 AI 与 RAG 知识库的对比">
  <style>
    .t { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .card { fill: #1e293b; stroke: #334155; }
    .rcard { fill: #1e293b; stroke: #334155; }
    .hi { fill: #134e4a; stroke: #2dd4bf; }
    .name { fill: #e2e8f0; font-size: 14px; font-weight: 600; }
    .small { fill: #94a3b8; font-size: 11.5px; }
    .teal { fill: #5eead4; font-size: 11.5px; }
    .warn { fill: #fbbf24; font-size: 11.5px; }
    .dim { fill: #64748b; font-size: 11px; letter-spacing: .06em; }
    .line { stroke: #475569; stroke-width: 1.5; fill: none; }
    .lineT { stroke: #2dd4bf; stroke-width: 1.5; fill: none; }
  </style>

  <!-- 左栏标题 -->
  <text class="t dim" x="20" y="14">直接把文件夹交给 AI</text>
  <rect class="card" x="20" y="26" width="345" height="52" rx="8"/>
  <text class="t name" x="40" y="58">全部文件塞进上下文</text>

  <path class="line" d="M192,78 V96"/>
  <rect class="card" x="20" y="98" width="345" height="66" rx="8"/>
  <text class="t name" x="40" y="126">模型自行翻阅 · 检索 · 心算</text>
  <text class="t small" x="40" y="148">在数百份定额与规范里"碰运气"</text>

  <path class="line" d="M192,164 V182"/>
  <rect class="card" x="20" y="184" width="345" height="52" rx="8"/>
  <text class="t name" x="40" y="216">输出一个答案</text>

  <rect class="card" x="20" y="258" width="345" height="178" rx="8" stroke="#3f2f1a"/>
  <text class="t dim" x="40" y="286">代价</text>
  <text class="t warn" x="40" y="314">· 上下文压力极大，容易超窗口</text>
  <text class="t small" x="40" y="342">· 数字读错、算错，难以察觉</text>
  <text class="t small" x="40" y="370">· 引用模糊，出处无从核对</text>
  <text class="t small" x="40" y="398">· 文件一改，全部要重新输入</text>
  <text class="t small" x="40" y="426">· 输出格式不可控</text>

  <!-- 右栏标题 -->
  <text class="t dim" x="395" y="14">使用 RAG 知识库</text>
  <rect class="card" x="395" y="26" width="345" height="52" rx="8"/>
  <text class="t name" x="415" y="58">切片 · 索引 · 向量化</text>

  <path class="lineT" d="M567,78 V96"/>
  <rect class="rcard" x="395" y="98" width="345" height="66" rx="8"/>
  <text class="t name" x="415" y="126">按需精准召回 3 – 5 条证据</text>
  <text class="t small" x="415" y="148">关键词与语义双路，再经重排打分</text>

  <path class="lineT" d="M567,164 V182"/>
  <rect class="rcard" x="395" y="184" width="345" height="52" rx="8"/>
  <text class="t name" x="415" y="216">模型基于证据组织语言</text>

  <rect class="hi" x="395" y="258" width="345" height="178" rx="8"/>
  <text class="t dim" x="415" y="286">收益</text>
  <text class="t teal" x="415" y="314">· 上下文只装最相关的片段</text>
  <text class="t small" x="415" y="342">· 定额、清单走脚本查表，不经过模型</text>
  <text class="t small" x="415" y="370">· 每条输出附带来源锚点，可核对</text>
  <text class="t small" x="415" y="398">· 文件更新只做增量索引</text>
  <text class="t small" x="415" y="426">· 模板与数据分离，格式可控</text>
</svg>
