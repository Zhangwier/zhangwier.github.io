<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="100%" role="img" aria-label="CostRAG：从检索到可验证的执行"><rect width="760" height="610" rx="20" fill="#0f172a"/><rect x="1" y="1" width="758" height="608" rx="19" fill="none" stroke="#334155"/><text x="36" y="49" class="heading">CostRAG：从检索到可验证的执行</text><text x="36" y="78" class="sub">知识与数据各走合适的通道，证据贯穿整个流程</text><style>.heading{font:700 25px 'Noto Sans CJK SC',sans-serif;fill:#e2e8f0}.sub{font:14px 'Noto Sans CJK SC',sans-serif;fill:#94a3b8}.node-title{font:700 17px 'Noto Sans CJK SC',sans-serif;fill:#e2e8f0}.node-desc{font:13px 'Noto Sans CJK SC',sans-serif;fill:#94a3b8}.small{font:12px 'Noto Sans CJK SC',sans-serif;fill:#94a3b8}.tag{font:700 12px 'Noto Sans CJK SC',sans-serif;fill:#5eead4}</style><rect x="200" y="105" width="360" height="72" rx="14" fill="#1e293b" stroke="#5eead4"/><text x="380" y="135" class="node-title" text-anchor="middle">任务入口 / 主控编排</text><text x="380" y="159" class="node-desc" text-anchor="middle">范围 · 工具路由 · 过程状态</text><rect x="35" y="222" width="222" height="91" rx="14" fill="#1e293b" stroke="#7dd3fc"/><text x="146" y="252" class="node-title" text-anchor="middle">文本知识</text><text x="146" y="280" class="node-desc" text-anchor="middle">规范条款 / 计量方法</text><rect x="269" y="222" width="222" height="91" rx="14" fill="#1e293b" stroke="#c4b5fd"/><text x="380" y="252" class="node-title" text-anchor="middle">精确数据</text><text x="380" y="280" class="node-desc" text-anchor="middle">编码 / 单位 / 信息价</text><rect x="503" y="222" width="222" height="91" rx="14" fill="#1e293b" stroke="#fbbf24"/><text x="614" y="252" class="node-title" text-anchor="middle">图纸文件</text><text x="614" y="280" class="node-desc" text-anchor="middle">PDF / 表格 / 截图</text><path d="M380 177 L380 199" fill="none" stroke="#5eead4" stroke-width="2"/><path d="M374 191L380 199L386 191" fill="none" stroke="#5eead4" stroke-width="2"/><path d="M146 200H614M146 200V222M614 200V222" fill="none" stroke="#5eead4" stroke-width="2"/><path d="