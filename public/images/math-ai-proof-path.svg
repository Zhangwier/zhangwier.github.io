<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="100%" role="img" aria-labelledby="title desc">
<title id="title">从模型结果到公共数学知识的四个阶段</title>
<desc id="desc">四个阶段依次是提出结果、验证正确性、形成人类理解、沉淀为公共知识。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs>
<rect width="760" height="450" rx="18" fill="url(#bg)"/>
<text x="34" y="49" font-family="Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="700">从“生成证明”到“形成知识”</text>
<text x="34" y="76" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">模型输出并不自动等于被共同体理解和接受</text>
<path d="M380 103V419" stroke="#334155" stroke-width="1" stroke-dasharray="4 9"/>
<path d="M351 186H405M378 178L405 186L378 194" fill="none" stroke="#5eead4" stroke-width="2"/>
<path d="M574 229V244H190V260" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 6"/>
<path d="M182 246L190 260L198 246" stroke="#64748b" fill="none" stroke-width="2"/>
<path d="M351 353H405M378 345L405 353L378 361" fill="none" stroke="#5eead4" stroke-width="2"/>
<rect x="34" y="112" width="308" height="116" rx="14" fill="#1e293b" stroke="#334155"/>
<rect x="418" y="112" width="308" height="116" rx="14" fill="#1e293b" stroke="#334155"/>
<rect x="34" y="278" width="308" height="116" rx="14" fill="#1e293b" stroke="#334155"/>
<rect x="418" y="278" width="308" height="116" rx="14" fill="#1e293b" stroke="#5eead4" stroke-opacity=".8"/>
<g font-family="Arial, sans-serif" font-weight="700" font-size="19">
<text x="54" y="146" fill="#7dd3fc">01</text><text x="100" y="146" fill="#e2e8f0">提出结果</text>
<text x="438" y="146" fill="#c4b5fd">02</text><text x="484" y="146" fill="#e2e8f0">验证正确性</text>
<text x="54" y="312" fill="#fbbf24">03</text><text x="100" y="312" fill="#e2e8f0">形成人类理解</text>
<text x="438" y="312" fill="#5eead4">04</text><text x="484" y="312" fill="#e2e8f0">沉淀公共知识</text>
</g>
<g font-family="Arial, sans-serif" font-size="15" fill="#94a3b8">
<text x="54" y="178">模型产生候选命题、证明</text><text x="54" y="202">需要明确假设与来源</text>
<text x="438" y="178">形式化检验与独立审查</text><text x="438" y="202">不能只依赖模型自评</text>
<text x="54" y="344">解释为何成立、何处有用</text><text x="54" y="368">同行讨论、纠错与传授</text>
<text x="438" y="344">可引用、可复核、可继承</text><text x="438" y="368">由共同体持续发展</text>
</g>
<text x="380" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">技术加速第一步，也应帮助承担后面每一步的成本</text>
</svg>