<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="100%" role="img" aria-label="CostRAG 四层架构">
  <style>
    .t { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .card { fill: #1e293b; stroke: #334155; }
    .name { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
    .desc { fill: #94a3b8; font-size: 12.5px; }
    .tag { fill: #5eead4; font-size: 11px; letter-spacing: .08em; }
    .bar { fill: #2dd4bf; }
  </style>

  <g>
    <rect class="card" x="20" y="20" width="720" height="76" rx="8"/>
    <rect class="bar" x="20" y="20" width="3" height="76" rx="1.5"/>
    <text class="t name" x="46" y="54">知识真源层</text>
    <text class="t desc" x="46" y="78">规范 · 方法 · 案例，每个知识单元附带来源锚点</text>
    <text class="t tag" x="716" y="54" text-anchor="end">检索召回</text>
  </g>

  <g>
    <rect class="card" x="20" y="112" width="720" height="76" rx="8"/>
    <rect class="bar" x="20" y="112" width="3" height="76" rx="1.5"/>
    <text class="t name" x="46" y="146">精确值层</text>
    <text class="t desc" x="46" y="170">定额 · 清单 · 材料价格等结构化数据，独立于检索流程</text>
    <text class="t tag" x="716" y="146" text-anchor="end">脚本查表</text>
  </g>

  <g>
    <rect class="card" x="20" y="204" width="720" height="76" rx="8"/>
    <rect class="bar" x="20" y="204" width="3" height="76" rx="1.5"/>
    <text class="t name" x="46" y="238">任务书层</text>
    <text class="t desc" x="46" y="262">定义任务步骤与执行约束，把一次工作固化成可复用的流程</text>
    <text class="t tag" x="716" y="238" text-anchor="end">约束</text>
  </g>

  <g>
    <rect class="card" x="20" y="296" width="720" height="76" rx="8"/>
    <rect class="bar" x="20" y="296" width="3" height="76" rx="1.5"/>
    <text class="t name" x="46" y="330">输出契约层</text>
    <text class="t desc" x="46" y="354">模板与 Schema 分离数据与格式，由脚本完成填充</text>
    <text class="t tag" x="716" y="330" text-anchor="end">脚本填充</text>
  </g>
</svg>
