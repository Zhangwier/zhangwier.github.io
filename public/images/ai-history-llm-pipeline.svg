<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-label="大语言模型从训练到对话">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1425"/><stop offset="1" stop-color="#132d3d"/></linearGradient><pattern id="dots" patternUnits="userSpaceOnUse" width="36" height="36"><circle cx="1" cy="1" r="1" fill="#507086" opacity="0.25"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#5eead4"/></marker><marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#7dd3fc"/></marker></defs>
<rect width="900" height="800" fill="url(#g)"/><rect width="900" height="800" fill="url(#dots)"/>
<rect x="18" y="18" width="864" height="764" rx="22" fill="none" stroke="#38516a" stroke-opacity="0.72"/>
<text x="55" y="87" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="35" font-weight="700" fill="#e2e8f0" text-anchor="start">大语言模型从训练到对话</text>
<text x="56" y="124" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="21" font-weight="400" fill="#9ab0c4" text-anchor="start">预训练只是第一步；不同模型的后训练方案不同</text>
<line x1="56" y1="147" x2="844" y2="147" stroke="#38516a" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="84" y="190" width="735" height="96" rx="12" fill="#15283d" fill-opacity="1" stroke="#38516a" stroke-width="1"/>
<rect x="103" y="216" width="58" height="46" rx="9" fill="#102236" fill-opacity="1" stroke="#5eead4" stroke-width="1"/>
<text x="132" y="247" font-family="'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace" font-size="23" font-weight="700" fill="#5eead4" text-anchor="middle">01</text>
<text x="191" y="228" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="28" font-weight="650" fill="#e2e8f0" text-anchor="start">预训练</text>
<text x="191" y="265" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="22" font-weight="400" fill="#9ab0c4" text-anchor="start">学习大量语料中的语言模式与关联</text>
<line x1="451" y1="288" x2="451" y2="307" stroke="#5eead4" stroke-width="2" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<rect x="84" y="310" width="735" height="96" rx="12" fill="#15283d" fill-opacity="1" stroke="#38516a" stroke-width="1"/>
<rect x="103" y="336" width="58" height="46" rx="9" fill="#102236" fill-opacity="1" stroke="#5eead4" stroke-width="1"/>
<text x="132" y="367" font-family="'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace" font-size="23" font-weight="700" fill="#5eead4" text-anchor="middle">02</text>
<text x="191" y="348" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="28" font-weight="650" fill="#e2e8f0" text-anchor="start">指令微调（常见）</text>
<text x="191" y="385" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="22" font-weight="400" fill="#9ab0c4" text-anchor="start">让模型更好地响应人类提出的任务</text>
<line x1="451" y1="408" x2="451" y2="427" stroke="#5eead4" stroke-width="2" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<rect x="84" y="430" width="735" height="96" rx="12" fill="#15283d" fill-opacity="1" stroke="#38516a" stroke-width="1"/>
<rect x="103" y="456" width="58" height="46" rx="9" fill="#102236" fill-opacity="1" stroke="#5eead4" stroke-width="1"/>
<text x="132" y="487" font-family="'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace" font-size="23" font-weight="700" fill="#5eead4" text-anchor="middle">03</text>
<text x="191" y="468" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="28" font-weight="650" fill="#e2e8f0" text-anchor="start">偏好优化（部分模型）</text>
<text x="191" y="505" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="22" font-weight="400" fill="#9ab0c4" text-anchor="start">利用偏好数据等方法改进输出行为</text>
<line x1="451" y1="528" x2="451" y2="547" stroke="#5eead4" stroke-width="2" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<rect x="84" y="550" width="735" height="96" rx="12" fill="#15283d" fill-opacity="1" stroke="#38516a" stroke-width="1"/>
<rect x="103" y="576" width="58" height="46" rx="9" fill="#102236" fill-opacity="1" stroke="#5eead4" stroke-width="1"/>
<text x="132" y="607" font-family="'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace" font-size="23" font-weight="700" fill="#5eead4" text-anchor="middle">04</text>
<text x="191" y="588" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="28" font-weight="650" fill="#e2e8f0" text-anchor="start">推理与工具调用</text>
<text x="191" y="625" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="22" font-weight="400" fill="#9ab0c4" text-anchor="start">依据上下文生成，并可连接检索与计算</text>
<text x="55" y="752" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="400" fill="#9ab0c4" text-anchor="start">并非所有模型都采用相同的指令微调或人类反馈流程。</text>
</svg>
