<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" width="100%" role="img" aria-label="图纸工程量复核的六个阶段：每阶段要回答的问题，以及条件不满足时的停止点">
  <style>
    .t { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .card { fill: #1e293b; stroke: #334155; }
    .numc { fill: #0f172a; stroke: #2dd4bf; }
    .num { fill: #5eead4; font-size: 12px; font-weight: 600; }
    .gate { fill: #e2e8f0; font-size: 14px; font-weight: 600; }
    .q { fill: #94a3b8; font-size: 12px; }
    .stop { fill: #5eead4; font-size: 11.5px; }
    .head { fill: #64748b; font-size: 11.5px; letter-spacing: .08em; }
  </style>

  <text class="t head" x="20" y="18">六个阶段 · 每阶段只回答一个问题，条件不满足则不进入下一阶段</text>

  <g>
    <rect class="card" x="20" y="38" width="720" height="74" rx="8"/>
    <circle class="numc" cx="56" cy="75" r="13"/>
    <text class="t num" x="56" y="79" text-anchor="middle">1</text>
    <text class="t gate" x="82" y="66">侦察</text>
    <text class="t q" x="150" y="66">只清点，不算量：哪些是图、哪些是底稿、有无变更图</text>
    <text class="t stop" x="82" y="94">准入条件：看不清的页面未标出、口径卡未形成 —— 不进入下一阶段</text>
  </g>

  <g>
    <rect class="card" x="20" y="124" width="720" height="74" rx="8"/>
    <circle class="numc" cx="56" cy="161" r="13"/>
    <text class="t num" x="56" y="165" text-anchor="middle">2</text>
    <text class="t gate" x="82" y="152">定界</text>
    <text class="t q" x="150" y="152">核什么、不核什么：对象、以哪类图为准、交付什么成果</text>
    <text class="t stop" x="82" y="180">准入条件：一段话讲不清范围 —— 仍停留在本阶段</text>
  </g>

  <g>
    <rect class="card" x="20" y="210" width="720" height="74" rx="8"/>
    <circle class="numc" cx="56" cy="247" r="13"/>
    <text class="t num" x="56" y="251" text-anchor="middle">3</text>
    <text class="t gate" x="82" y="238">拆解</text>
    <text class="t q" x="150" y="238">每一项都绑上图：如何切片、每片对应哪些页码</text>
    <text class="t stop" x="82" y="266">准入条件：没有页码的行 —— 不得进入核量阶段</text>
  </g>

  <g>
    <rect class="card" x="20" y="296" width="720" height="74" rx="8"/>
    <circle class="numc" cx="56" cy="333" r="13"/>
    <text class="t num" x="56" y="337" text-anchor="middle">4</text>
    <text class="t gate" x="82" y="324">核量</text>
    <text class="t q" x="150" y="324">先提取尺寸，人确认，再写公式：清晰还是存疑</text>
    <text class="t stop" x="82" y="352">准入条件：公式中焊有死尺寸、存疑项被填成确定值 —— 该分项不算完成</text>
  </g>

  <g>
    <rect class="card" x="20" y="382" width="720" height="74" rx="8"/>
    <circle class="numc" cx="56" cy="419" r="13"/>
    <text class="t num" x="56" y="423" text-anchor="middle">5</text>
    <text class="t gate" x="82" y="410">复核</text>
    <text class="t q" x="150" y="410">另开新对话：计算、图纸、表间、表格结构四层都要有结论</text>
    <text class="t stop" x="82" y="438">准入条件：任何一层没有独立结论 —— 不得定稿</text>
  </g>

  <g>
    <rect class="card" x="20" y="468" width="720" height="74" rx="8"/>
    <circle class="numc" cx="56" cy="505" r="13"/>
    <text class="t num" x="56" y="509" text-anchor="middle">6</text>
    <text class="t gate" x="82" y="496">交付</text>
    <text class="t q" x="150" y="496">交出能追溯的一套：底稿、增减对照、问题清单、证据链</text>
    <text class="t stop" x="82" y="524">准入条件：清单中每一条都有处理结果或未关闭原因</text>
  </g>
</svg>
