<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-label="从写规则到学习规律">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1425"/><stop offset="1" stop-color="#132d3d"/></linearGradient><pattern id="dots" patternUnits="userSpaceOnUse" width="36" height="36"><circle cx="1" cy="1" r="1" fill="#507086" opacity="0.25"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#5eead4"/></marker><marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#7dd3fc"/></marker></defs>
<rect width="900" height="720" fill="url(#g)"/><rect width="900" height="720" fill="url(#dots)"/>
<rect x="18" y="18" width="864" height="684" rx="22" fill="none" stroke="#38516a" stroke-opacity="0.72"/>
<text x="55" y="87" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="35" font-weight="700" fill="#e2e8f0" text-anchor="start">从写规则到学习规律</text>
<text x="56" y="124" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="21" font-weight="400" fill="#9ab0c4" text-anchor="start">以垃圾邮件分类为例，理解技术路线的根本差别</text>
<line x1="56" y1="147" x2="844" y2="147" stroke="#38516a" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="69" y="190" width="755" height="197" rx="16" fill="#15283d" fill-opacity="1" stroke="#38516a" stroke-width="1"/>
<rect x="81" y="214" width="8" height="46" rx="3" fill="#fbbf24" fill-opacity="1"/>
<text x="111" y="254" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="28" font-weight="700" fill="#e2e8f0" text-anchor="start">规则系统  RULE-BASED</text>
<text x="112" y="303" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="25" font-weight="400" fill="#b9c8d6" text-anchor="start">程序员编规则</text>
<line x1="318" y1="296" x2="408" y2="296" stroke="#5eead4" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="447" y="303" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="25" font-weight="400" fill="#b9c8d6" text-anchor="start">检查邮件内容</text>
<line x1="659" y1="296" x2="694" y2="296" stroke="#5eead4" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="704" y="303" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="25" font-weight="650" fill="#e2e8f0" text-anchor="start">判定</text>
<text x="111" y="352" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="20" font-weight="400" fill="#9ab0c4" text-anchor="start">例如：出现某关键词 → 标记垃圾邮件</text>
<rect x="69" y="414" width="755" height="222" rx="16" fill="#15283d" fill-opacity="1" stroke="#38516a" stroke-width="1"/>
<rect x="81" y="439" width="8" height="46" rx="3" fill="#5eead4" fill-opacity="1"/>
<text x="111" y="480" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="28" font-weight="700" fill="#e2e8f0" text-anchor="start">机器学习  MACHINE LEARNING</text>
<text x="112" y="528" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="25" font-weight="400" fill="#b9c8d6" text-anchor="start">带标签的样本</text>
<line x1="327" y1="521" x2="405" y2="521" stroke="#5eead4" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="441" y="528" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="25" font-weight="400" fill="#b9c8d6" text-anchor="start">模型训练</text>
<line x1="586" y1="521" x2="662" y2="521" stroke="#5eead4" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<text x="682" y="528" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="25" font-weight="650" fill="#e2e8f0" text-anchor="start">预测</text>
<text x="111" y="582" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="20" font-weight="400" fill="#9ab0c4" text-anchor="start">模型从样本学习模式，但效果受数据与任务变化影响。</text>
<text x="55" y="672" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="400" fill="#9ab0c4" text-anchor="start">现实系统常把规则、统计模型与人工复核结合使用。</text>
</svg>
