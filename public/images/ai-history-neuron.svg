<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" role="img" aria-label="一个“神经元”怎样计算？">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1425"/><stop offset="1" stop-color="#132d3d"/></linearGradient><pattern id="dots" patternUnits="userSpaceOnUse" width="36" height="36"><circle cx="1" cy="1" r="1" fill="#507086" opacity="0.25"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#5eead4"/></marker><marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#7dd3fc"/></marker></defs>
<rect width="900" height="690" fill="url(#g)"/><rect width="900" height="690" fill="url(#dots)"/>
<rect x="18" y="18" width="864" height="654" rx="22" fill="none" stroke="#38516a" stroke-opacity="0.72"/>
<text x="55" y="87" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="35" font-weight="700" fill="#e2e8f0" text-anchor="start">一个“神经元”怎样计算？</text>
<text x="56" y="124" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="21" font-weight="400" fill="#9ab0c4" text-anchor="start">输入、权重、求和、偏置、激活函数</text>
<line x1="56" y1="147" x2="844" y2="147" stroke="#38516a" stroke-width="1" stroke-linecap="round" opacity="1"/>
<rect x="75" y="196" width="190" height="76" rx="13" fill="#15283d" fill-opacity="1" stroke="#38516a" stroke-width="1"/>
<text x="170" y="243" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="26" font-weight="550" fill="#e2e8f0" text-anchor="middle">x₁：输入 1</text>
<line x1="268" y1="235" x2="410" y2="339" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<rect x="75" y="300" width="190" height="76" rx="13" fill="#15283d" fill-opacity="1" stroke="#38516a" stroke-width="1"/>
<text x="170" y="347" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="26" font-weight="550" fill="#e2e8f0" text-anchor="middle">x₂：输入 2</text>
<line x1="268" y1="339" x2="410" y2="339" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<rect x="75" y="404" width="190" height="76" rx="13" fill="#15283d" fill-opacity="1" stroke="#38516a" stroke-width="1"/>
<text x="170" y="451" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="26" font-weight="550" fill="#e2e8f0" text-anchor="middle">x₃：输入 3</text>
<line x1="268" y1="443" x2="410" y2="339" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<circle cx="486" cy="337" r="95" fill="#15283d" stroke="#5eead4" stroke-width="4"/>
<text x="486" y="327" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="26" font-weight="650" fill="#e2e8f0" text-anchor="middle">加权求和</text>
<text x="486" y="369" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="26" font-weight="650" fill="#e2e8f0" text-anchor="middle">再加偏置</text>
<line x1="581" y1="338" x2="653" y2="338" stroke="#5eead4" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/>
<rect x="661" y="291" width="172" height="92" rx="13" fill="#15283d" fill-opacity="1" stroke="#38516a" stroke-width="1"/>
<text x="746" y="332" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="29" font-weight="650" fill="#e2e8f0" text-anchor="middle">激活 f</text>
<text x="746" y="366" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="23" font-weight="550" fill="#5eead4" text-anchor="middle">输出 y</text>
<rect x="112" y="531" width="680" height="83" rx="10" fill="#102236" fill-opacity="1" stroke="#38516a" stroke-width="1"/>
<text x="453" y="583" font-family="'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace" font-size="30" font-weight="600" fill="#5eead4" text-anchor="middle">y = f(w₁x₁ + w₂x₂ + w₃x₃ + b)</text>
<text x="55" y="642" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="400" fill="#9ab0c4" text-anchor="start">w 表示权重；b 表示偏置；f 是激活函数。</text>
</svg>
